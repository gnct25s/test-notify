apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-notice-app
  name: test-notice-deployment
  namespace: test-notice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-notice-app
  template:
    metadata:
      labels:
        app: test-notice-app

    spec:
      containers:
        - name: test-notice-container
          image: ghcr.io/gnct25s/test-notice-bot:v2.3.0
          env:
            - name: TZ
              value: "Asia/Tokyo"
          envFrom:
            - secretRef:
                name: test-notice-secret
          imagePullPolicy: IfNotPresent
