apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: discord-bot
  name: discord-bot
  namespace: test-notice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot

    spec:
      containers:
        - name: discord-bot
          image: ghcr.io/gnct25s/test-notice-bot:v3.0.0-rc1
          env:
            - name: TZ
              value: "Asia/Tokyo"
          envFrom:
            - secretRef:
                name: discord-bot
          imagePullPolicy: IfNotPresent
